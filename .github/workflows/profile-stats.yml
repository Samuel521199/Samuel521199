name: Refresh profile statistics

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-stats.yml'
      - 'tools/**'
      - 'tests/**'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test collector boundaries
        run: python -m unittest discover -s tests
      - name: Collect public metadata and render statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/update_stats.py
      - name: Commit changed statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public-projects.json assets/stats.svg assets/stats-compact.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh public repository statistics"
          git pull --rebase origin main
          git push origin HEAD:main
