<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" role="img" aria-labelledby="title desc">
<title id="title">Samuel — AI systems, workflows and creative tools</title>
<desc id="desc">Dark technical layout with cyan and violet accents. Decorative slow orbit and scanning motion; reduced-motion supported.</desc>
<defs>
 <linearGradient id="edge"><stop stop-color="#59eadb"/><stop offset=".55" stop-color="#5077be"/><stop offset="1" stop-color="#ba91ff"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#234962" stop-opacity=".58"/><stop offset="1" stop-color="#09101b" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1c2c3e" stroke-width=".7"/></pattern>
 <clipPath id="frame"><rect width="700" height="470" rx="12"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.mono{font-family:Consolas,'Liberation Mono',monospace}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 36s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
.scan{animation:scan 12s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes scan{0%,100%{transform:translateX(0);opacity:0}15%,75%{opacity:.65}85%{transform:translateX(950px);opacity:0}}
@media(prefers-reduced-motion:reduce){.orbit,.pulse,.scan{animation:none}.scan{display:none}}
</style>
<g clip-path="url(#frame)">
 <rect width="700" height="470" fill="#090f19"/>
 <rect width="700" height="470" fill="url(#grid)" opacity=".45"/>
 <text x="42" y="48" fill="#65e5da" font-size="15" class="mono" letter-spacing="2">SAMUEL521199 / PUBLIC LAB</text><text x="42" y="148" fill="#f0f6fc" font-size="84" font-weight="750" letter-spacing="-3">SAMUEL</text><text x="42" y="206" fill="#d3e2f1" font-size="30" >把想法，构建成系统。</text><text x="42" y="262" fill="#ae98ec" font-size="18" class="mono">AI SYSTEMS  /  WORKFLOWS</text><text x="42" y="293" fill="#ae98ec" font-size="18" class="mono">GAMES  /  CREATIVE TOOLS</text><path d="M42 335H658" stroke="#25364a"/><text x="42" y="381" fill="#eef4ff" font-size="22" class="mono">BUILD SYSTEMS. MAKE THEM REAL.</text><text x="42" y="430" fill="#8da5bf" font-size="14" class="mono">SOURCE CODE  →  DESIGN NOTES  →  ITERATION</text><rect class="scan" x="0" y="0" width="2" height="470" fill="#72eedc" opacity=".1"/>
 <rect x=".5" y=".5" width="699" height="469" rx="12" fill="none" stroke="#29394d"/>
 <path d="M1 36V1H90M610 469H699V434" fill="none" stroke="url(#edge)" stroke-width="2"/>
</g></svg>
